    <tspan x="40" dy="17">③ 派发 runner：长连接流式消息，逐帧回传会话 / 消息 / 结果；控制面滑动超时，runner 看门狗兜底</tspan>
    <tspan x="40" dy="17">④ Agent SDK 在 runner 本地工作目录内自行下载文件、分析、输出结构化结果，最后回调业务方</tspan>
  </text>

